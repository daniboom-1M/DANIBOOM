<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DANIBOOM | LOGIN</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{--neon:#ffd700;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Orbitron',sans-serif;}
body{
  background:radial-gradient(circle at top,#111,#000);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
}
.container{
  width:100%;
  max-width:420px;
  padding:2.5rem;
  border:2px solid var(--neon);
  border-radius:22px;
  box-shadow:0 0 35px rgba(255,215,0,.7);
}
.logo{text-align:center;margin-bottom:1.5rem;}
.logo img{
  width:110px;height:110px;border-radius:50%;
  border:3px solid var(--neon);
  box-shadow:0 0 30px var(--neon);
}
.tabs{display:flex;margin-bottom:1.5rem;}
.tabs button{
  flex:1;background:none;border:none;color:#777;
  padding:.6rem;cursor:pointer;
}
.tabs button.active{
  color:var(--neon);
  text-shadow:0 0 10px var(--neon);
}
.form{display:none;}
.form.active{display:block;}
.form h2{text-align:center;color:var(--neon);margin-bottom:1rem;}
.input{
  width:100%;padding:.9rem;margin-bottom:.8rem;
  background:#111;border:2px solid #333;
  border-radius:12px;color:#fff;
}
.input:focus{
  outline:none;border-color:var(--neon);
  box-shadow:0 0 10px var(--neon);
}
.btn{
  width:100%;padding:.9rem;border:none;
  border-radius:30px;background:var(--neon);
  color:#000;font-weight:800;cursor:pointer;
}
.social{display:flex;gap:.8rem;margin-top:1rem;}
.social button{
  flex:1;padding:.7rem;border-radius:12px;
  border:2px solid var(--neon);
  background:none;color:var(--neon);
  cursor:pointer;
}
.switch{text-align:center;margin-top:1rem;font-size:13px;color:#aaa;}
.switch span{color:var(--neon);cursor:pointer;}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    <img src="logo.png" alt="DANIBOOM">
  </div>

  <div class="tabs">
    <button id="tabLogin" class="active" onclick="showLogin()">INICIAR SESIÓN</button>
    <button id="tabRegister" onclick="showRegister()">CREAR CUENTA</button>
  </div>

  <!-- LOGIN -->
  <div class="form active" id="loginForm">
    <h2>Bienvenido</h2>
    <input id="loginEmail" class="input" placeholder="Correo">
    <input id="loginPassword" type="password" class="input" placeholder="Contraseña">
    <button class="btn" onclick="login()">Entrar</button>

    <div class="social">
      <button onclick="loginGoogle()"><i class="fab fa-google"></i> Google</button>
    </div>

    <p class="switch">¿No tienes cuenta? <span onclick="showRegister()">Crear cuenta</span></p>
  </div>

  <!-- REGISTRO -->
  <div class="form" id="registerForm">
    <h2>Crear cuenta</h2>
    <input id="regEmail" class="input" placeholder="Correo">
    <input id="regPassword" type="password" class="input" placeholder="Contraseña">
    <button class="btn" onclick="register()">Crear cuenta</button>

    <p class="switch">¿Ya tienes cuenta? <span onclick="showLogin()">Iniciar sesión</span></p>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  signInWithRedirect,
  getRedirectResult
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import {
  getFirestore,
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyChOQg743fsmGK89KVLoNAri_VGklArRi4",
  authDomain: "web1-3b83a.firebaseapp.com",
  projectId: "web1-3b83a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* GOOGLE PROVIDER */
const googleProvider = new GoogleAuthProvider();
googleProvider.setCustomParameters({ prompt: "select_account" });

/* DETECTAR MÓVIL */
const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);

/* REDIRECT RESULT (MÓVIL) */
getRedirectResult(auth).then(async (result) => {
  if (result?.user) {
    await saveUser(result.user);
    window.location.href = "main.html";
  }
});

/* SESIÓN ACTIVA */
onAuthStateChanged(auth, async (user) => {
  if (user) {
    await saveUser(user);
    window.location.href = "main.html";
  }
});

/* GUARDAR USUARIO */
async function saveUser(user){
  const ref = doc(db,"users",user.uid);
  const snap = await getDoc(ref);
  if(!snap.exists()){
    await setDoc(ref,{
      email:user.email,
      role:"Miembro",
      membership:"free",
      createdAt:new Date()
    });
  }
}

/* LOGIN EMAIL */
window.login = async ()=>{
  try{
    await signInWithEmailAndPassword(
      auth,
      loginEmail.value.trim(),
      loginPassword.value
    );
  }catch{
    alert("Correo o contraseña incorrectos");
  }
};

/* REGISTRO EMAIL */
window.register = async ()=>{
  try{
    await createUserWithEmailAndPassword(
      auth,
      regEmail.value.trim(),
      regPassword.value
    );
  }catch{
    alert("Error al crear cuenta");
  }
};

/* LOGIN GOOGLE (PC / MÓVIL) */
window.loginGoogle = async ()=>{
  try{
    if(isMobile){
      await signInWithRedirect(auth, googleProvider);
    }else{
      const result = await signInWithPopup(auth, googleProvider);
      await saveUser(result.user);
      window.location.href = "main.html";
    }
  }catch(e){
    console.error(e);
    alert("Error al iniciar sesión con Google");
  }
};

/* UI */
window.showLogin = ()=>{
  loginForm.classList.add("active");
  registerForm.classList.remove("active");
  tabLogin.classList.add("active");
  tabRegister.classList.remove("active");
};
window.showRegister = ()=>{
  registerForm.classList.add("active");
  loginForm.classList.remove("active");
  tabRegister.classList.add("active");
  tabLogin.classList.remove("active");
};
</script>

</body>
</html>
