<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DANIBOOM | LOGIN</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
  --neon:#ffd700;
  --error:#ff3b3b;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Orbitron',sans-serif}
body{
  background:radial-gradient(circle at top,#111,#000);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
}
.container{
  width:100%;
  max-width:420px;
  padding:2.5rem;
  border:2px solid var(--neon);
  border-radius:22px;
  box-shadow:0 0 35px rgba(255,215,0,.7);
}
.logo{text-align:center;margin-bottom:1.5rem}
.logo img{
  width:110px;height:110px;
  border-radius:50%;
  border:3px solid var(--neon);
  box-shadow:0 0 30px var(--neon);
}
.tabs{display:flex;margin-bottom:1.5rem}
.tabs button{
  flex:1;background:none;border:none;
  color:#777;padding:.6rem;
  cursor:pointer;
}
.tabs button.active{
  color:var(--neon);
  text-shadow:0 0 10px var(--neon);
}
.form{display:none}
.form.active{display:block}
.form h2{text-align:center;color:var(--neon);margin-bottom:1rem}

.input{
  width:100%;
  padding:.9rem;
  margin-bottom:.4rem;
  background:#111;
  border:2px solid #333;
  border-radius:12px;
  color:#fff;
}
.input.error{
  border-color:var(--error);
  box-shadow:0 0 12px var(--error);
}

.msg{
  font-size:12px;
  color:#ffbaba;
  margin-bottom:1rem;
}
.msg span{
  color:var(--neon);
  cursor:pointer;
}

.btn{
  width:100%;
  padding:.9rem;
  border:none;
  border-radius:30px;
  background:var(--neon);
  color:#000;
  font-weight:800;
  cursor:pointer;
}

.social{
  display:flex;
  gap:.8rem;
  margin-top:1rem;
}
.social button{
  flex:1;
  padding:.7rem;
  border-radius:12px;
  border:2px solid var(--neon);
  background:none;
  color:var(--neon);
  cursor:pointer;
}
.social i{margin-right:6px}

.switch{text-align:center;margin-top:1rem;font-size:13px;color:#aaa}
.switch span{color:var(--neon);cursor:pointer}
</style>
</head>

<body>

<div class="container">

<div class="logo">
  <img src="logo.png">
</div>

<div class="tabs">
  <button id="tabLogin" class="active" onclick="showLogin()">INICIAR SESIÓN</button>
  <button id="tabRegister" onclick="showRegister()">CREAR CUENTA</button>
</div>

<div class="form active" id="loginForm">
  <h2>Bienvenido</h2>

  <input id="loginEmail" class="input" placeholder="Correo electrónico">
  <input type="password" id="loginPassword" class="input" placeholder="Contraseña">

  <div id="loginMsg" class="msg"></div>

  <button class="btn" onclick="login()">Entrar</button>

  <div class="social">
    <button onclick="loginGoogle()"><i class="fab fa-google"></i>Google</button>
    <button onclick="loginFacebook()"><i class="fab fa-facebook-f"></i>Facebook</button>
  </div>

  <p class="switch">
    ¿No tienes cuenta? <span onclick="showRegister()">Crear cuenta</span>
  </p>
</div>

<div class="form" id="registerForm">
  <h2>Crear cuenta</h2>

  <input id="regEmail" class="input" placeholder="Correo electrónico">
  <input type="password" id="regPassword" class="input" placeholder="Contraseña">

  <button class="btn" onclick="register()">Crear cuenta</button>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  GoogleAuthProvider,
  FacebookAuthProvider,
  signInWithPopup
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyChOQg743fsmGK89KVLoNAri_VGklArRi4",
  authDomain: "web1-3b83a.firebaseapp.com"
});
const auth = getAuth(app);

window.login = async () => {
  loginMsg.innerHTML = "";
  loginEmail.classList.remove("error");
  loginPassword.classList.remove("error");

  try {
    await signInWithEmailAndPassword(
      auth,
      loginEmail.value.trim(),
      loginPassword.value
    );
    location.href = "redes.html";
  } catch (e) {

    if (e.code === "auth/user-not-found") {
      loginEmail.classList.add("error");
      loginMsg.innerHTML = `
        La cuenta no existe.<br>
        <span onclick="showRegister()">¿Deseas crear una?</span>
      `;
    }

    if (e.code === "auth/wrong-password") {
      loginPassword.classList.add("error");
      loginMsg.innerHTML = `
        Contraseña incorrecta.<br>
        <span onclick="location.href='reset.html'">¿Olvidaste tu contraseña?</span>
      `;
    }
  }
};

window.register = async () => {
  await createUserWithEmailAndPassword(
    auth,
    regEmail.value.trim(),
    regPassword.value
  );
  showLogin();
};

window.loginGoogle = async () => {
  await signInWithPopup(auth, new GoogleAuthProvider());
  location.href = "redes.html";
};

window.loginFacebook = async () => {
  await signInWithPopup(auth, new FacebookAuthProvider());
  location.href = "redes.html";
};

window.showLogin = () => {
  loginForm.classList.add("active");
  registerForm.classList.remove("active");
};

window.showRegister = () => {
  registerForm.classList.add("active");
  loginForm.classList.remove("active");
};
</script>

</body>
</html>
