<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DANIBOOM | LOGIN</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
  --neon:#ffd700;
  --role-color:#ffd700; /* Color del rol Miembro */
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Orbitron',sans-serif;}
body{
  background:radial-gradient(circle at top,#111,#000);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
}

.container{
  width:100%;
  max-width:420px;
  padding:2.5rem;
  border:2px solid var(--neon);
  border-radius:22px;
  box-shadow:0 0 35px rgba(255,215,0,.7);
}

.logo{text-align:center;margin-bottom:1.5rem;}
.logo img{
  width:110px;height:110px;
  border-radius:50%;
  border:3px solid var(--neon);
  box-shadow:0 0 30px var(--neon);
}

.tabs{display:flex;margin-bottom:1.5rem;}
.tabs button{
  flex:1;
  background:none;
  border:none;
  color:#777;
  padding:.6rem;
  cursor:pointer;
  transition:.3s;
}
.tabs button.active{
  color:var(--neon);
  text-shadow:0 0 10px var(--neon);
}

.form{display:none;}
.form.active{display:block;}
.form h2{text-align:center;color:var(--neon);margin-bottom:1rem;}
.input{
  width:100%;
  padding:.9rem;
  margin-bottom:.8rem;
  background:#111;
  border:2px solid #333;
  border-radius:12px;
  color:#fff;
  transition:.3s;
}
.input:focus{
  outline:none;
  border-color:var(--neon);
  box-shadow:0 0 10px var(--neon);
}

.btn{
  width:100%;
  padding:.9rem;
  border:none;
  border-radius:30px;
  background:var(--neon);
  color:#000;
  font-weight:800;
  cursor:pointer;
  transition:.3s;
}
.btn:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px var(--neon);
}

.social{
  display:flex;
  gap:.8rem;
  margin-top:1rem;
}
.social button{
  flex:1;
  padding:.7rem;
  border-radius:12px;
  border:2px solid var(--neon);
  background:none;
  color:var(--neon);
  cursor:pointer;
  transition:.3s;
}
.social button:hover{
  background:var(--neon);
  color:#000;
}
.social i{margin-right:6px;}

.switch{text-align:center;margin-top:1rem;font-size:13px;color:#aaa;}
.switch span{color:var(--neon);cursor:pointer;}

/* ===== ESTRELLA BRILLANTE PARA ROL ===== */
.user-role {
  display:flex;
  align-items:center;
  gap:6px;
  font-weight:700;
  font-size:16px;
  color: var(--role-color);
}

.user-role .star {
  color: var(--role-color);
  animation: shine 1.5s infinite alternate;
}

@keyframes shine {
  0% { text-shadow: 0 0 2px #fff, 0 0 4px var(--role-color);}
  50% { text-shadow: 0 0 6px #fff, 0 0 12px var(--role-color);}
  100% { text-shadow: 0 0 2px #fff, 0 0 4px var(--role-color);}
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    <img src="logo.png" alt="DANIBOOM">
  </div>

  <div class="tabs">
    <button id="tabLogin" class="active" onclick="showLogin()">INICIAR SESIÓN</button>
    <button id="tabRegister" onclick="showRegister()">CREAR CUENTA</button>
  </div>

  <!-- LOGIN -->
  <div class="form active" id="loginForm">
    <h2>Bienvenido</h2>
    <input id="loginEmail" class="input" placeholder="Correo electrónico">
    <input id="loginPassword" type="password" class="input" placeholder="Contraseña">
    <button class="btn" onclick="login()">Entrar</button>

    <div class="social">
      <button onclick="loginGoogle()"><i class="fab fa-google"></i>Google</button>
      <button onclick="loginFacebook()"><i class="fab fa-facebook-f"></i>Facebook</button>
    </div>

    <p class="switch">
      ¿No tienes cuenta? <span onclick="showRegister()">Crear cuenta</span>
    </p>
  </div>

  <!-- REGISTRO -->
  <div class="form" id="registerForm">
    <h2>Crear cuenta</h2>
    <input id="regEmail" class="input" placeholder="Correo electrónico">
    <input id="regPassword" type="password" class="input" placeholder="Contraseña">
    <button class="btn" onclick="register()">Crear cuenta</button>

    <div class="social">
      <button onclick="loginGoogle()"><i class="fab fa-google"></i>Google</button>
      <button onclick="loginFacebook()"><i class="fab fa-facebook-f"></i>Facebook</button>
    </div>

    <p class="switch">
      ¿Ya tienes cuenta? <span onclick="showLogin()">Iniciar sesión</span>
    </p>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  FacebookAuthProvider,
  signInWithPopup
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* ================= FIREBASE CONFIG ================= */
const firebaseConfig = {
  apiKey: "AIzaSyChOQg743fsmGK89KVLoNAri_VGklArRi4",
  authDomain: "web1-3b83a.firebaseapp.com",
  projectId: "web1-3b83a"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ================= PROVIDERS ================= */
const googleProvider = new GoogleAuthProvider();
const facebookProvider = new FacebookAuthProvider();

/* ================= LOGIN ================= */
window.login = async () => {
  const email = loginEmail.value.trim();
  const password = loginPassword.value;
  if(!email || !password) return;

  try {
    await signInWithEmailAndPassword(auth, email, password);
    location.href = "main.html";
  } catch(err) {
    console.error(err);
    alert("Error al iniciar sesión. Verifica tu correo y contraseña.");
  }
};

/* ================= REGISTRO ================= */
window.register = async () => {
  const email = regEmail.value.trim();
  const password = regPassword.value;
  if(!email || !password) return;

  try {
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;

    // Guardar datos en Firestore con rol inicial "Miembro"
    await setDoc(doc(db, "users", user.uid), {
      email: user.email,
      role: "Miembro",
      roleColor: "#ffd700",
      membership: "free",
      createdAt: new Date()
    });

    alert("Cuenta creada con éxito. Ahora puedes iniciar sesión.");
    showLogin();
  } catch(err) {
    console.error(err);
    if(err.code === "auth/email-already-in-use") alert("El correo ya está registrado.");
    else if(err.code === "auth/weak-password") alert("Contraseña demasiado débil (mínimo 6 caracteres).");
    else alert("Error al crear cuenta. Revisa la consola.");
  }
};

/* ================= GOOGLE ================= */
window.loginGoogle = async () => {
  try {
    const result = await signInWithPopup(auth, googleProvider);
    await setDoc(doc(db,"users",result.user.uid),{
      email: result.user.email,
      #####role: "Miembro",
      roleColor: "#ffd700",
      membership: "free",
      createdAt: new Date()
    }, { merge: true });
    location.href = "main.html";
  } catch(err){
    console.error(err);
  }
};

/* ================= FACEBOOK ================= */
window.loginFacebook = async () => {
  try {
    const result = await signInWithPopup(auth, facebookProvider);
    await setDoc(doc(db,"users",result.user.uid),{
      email: result.user.email,
      role: "Miembro",
      roleColor: "#ffd700",
      membership: "free",
      createdAt: new Date()
    }, { merge: true });
    location.href = "main.html";
  } catch(err){
    console.error(err);
  }
};

/* ================= UI ================= */
window.showLogin = () => {
  registerForm.classList.remove("active");
  loginForm.classList.add("active");
  tabLogin.classList.add("active");
  tabRegister.classList.remove("active");
};

window.showRegister = () => {
  loginForm.classList.remove("active");
  registerForm.classList.add("active");
  tabRegister.classList.add("active");
  tabLogin.classList.remove("active");
};
</script>

</body>
</html>
