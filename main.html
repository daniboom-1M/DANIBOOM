<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DANIBOOM | Principal</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
  --neon:#ffd700;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Orbitron',sans-serif;}

body{
  background:radial-gradient(circle at top,#111,#000);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  flex-direction:column;
}

.container{
  width:100%;
  max-width:500px;
  padding:2rem;
  border:2px solid var(--neon);
  border-radius:22px;
  box-shadow:0 0 35px rgba(255,215,0,.7);
  text-align:center;
}

h1{
  color:var(--neon);
  margin-bottom:1rem;
}

.user-info{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-bottom:1.5rem;
  font-size:18px;
}

.user-info .star{
  color:var(--neon);
  animation: shine 1.5s infinite alternate;
}

@keyframes shine{
  0%{text-shadow:0 0 2px #fff,0 0 4px var(--neon);}
  50%{text-shadow:0 0 6px #fff,0 0 12px var(--neon);}
  100%{text-shadow:0 0 2px #fff,0 0 4px var(--neon);}
}

.nav-buttons{
  display:flex;
  flex-direction:column;
  gap:1rem;
}

.nav-buttons button{
  padding:1rem;
  border-radius:30px;
  border:none;
  background:var(--neon);
  color:#000;
  font-weight:800;
  cursor:pointer;
  transition:.3s;
}
.nav-buttons button:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px var(--neon);
}
</style>
</head>
<body>

<div class="container">
  <h1>Bienvenido, <span id="username">Usuario</span></h1>

  <div class="user-info">
    <span id="roleName">Miembro</span>
    <i class="fas fa-star star"></i>
  </div>

  <div class="nav-buttons">
    <button onclick="goTo('redes.html')">Ir a Redes</button>
    <button onclick="goTo('perfil.html')">Ir a Perfil</button>
    <button onclick="logout()">Cerrar Sesión</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyChOQg743fsmGK89KVLoNAri_VGklArRi4",
  authDomain: "web1-3b83a.firebaseapp.com",
  projectId: "web1-3b83a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {
  if(user){
    const docSnap = await getDoc(doc(db, "users", user.uid));
    if(docSnap.exists()){
      document.getElementById("username").textContent = user.email.split("@")[0];
      document.getElementById("roleName").textContent = docSnap.data().role;
    }
  } else {
    // Si no hay usuario logueado, redirige al login
    location.href = "login.html";
  }
});

function goTo(page){
  location.href = page;
}

function logout(){
  signOut(auth).then(() => {
    location.href = "login.html";
  });
}
</script>

</body>
</html>
