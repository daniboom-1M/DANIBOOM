<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DANIBOOM | LOGIN</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{--neon:#ffd700;--bg:#0b0b0b}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Orbitron',sans-serif}
body{
  background:radial-gradient(circle at top,#111,#000);
  color:#fff;min-height:100vh;
  display:flex;align-items:center;justify-content:center
}
.container{
  width:100%;max-width:420px;padding:2.5rem;
  border:2px solid var(--neon);border-radius:22px;
  box-shadow:0 0 35px rgba(255,215,0,.7);
  animation:fadeIn 1s ease
}
.logo{text-align:center;margin-bottom:1.5rem}
.logo img{
  width:110px;height:110px;border-radius:50%;
  border:3px solid var(--neon);
  box-shadow:0 0 30px var(--neon)
}
.tabs{display:flex;margin-bottom:1.5rem}
.tabs button{
  flex:1;background:none;border:none;
  color:#777;padding:.6rem;cursor:pointer
}
.tabs button.active{color:var(--neon);text-shadow:0 0 10px var(--neon)}
.form{display:none;animation:slide .6s ease}
.form.active{display:block}
.form h2{text-align:center;color:var(--neon);margin-bottom:1rem}
.input{
  width:100%;padding:.9rem;margin-bottom:1rem;
  background:#111;border:2px solid #333;
  border-radius:12px;color:#fff
}
.input:focus{border-color:var(--neon);box-shadow:0 0 12px var(--neon)}
.btn{
  width:100%;padding:.9rem;border:none;
  border-radius:30px;background:var(--neon);
  color:#000;font-weight:800;cursor:pointer
}
.switch{text-align:center;margin-top:1rem;font-size:13px;color:#aaa}
.switch span{color:var(--neon);cursor:pointer}

@keyframes fadeIn{from{opacity:0;transform:scale(.9)}to{opacity:1}}
@keyframes slide{from{opacity:0;transform:translateY(30px)}to{opacity:1}}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    <img src="logo.png">
  </div>

  <div class="tabs">
    <button id="tabLogin" class="active" onclick="showLogin()">INICIAR SESIÓN</button>
    <button id="tabRegister" onclick="showRegister()">CREAR CUENTA</button>
  </div>

  <!-- LOGIN -->
  <div class="form active" id="loginForm">
    <h2>Bienvenido</h2>
    <input id="loginUser" class="input" placeholder="Correo o Usuario">
    <input type="password" id="loginPassword" class="input" placeholder="Contraseña">
    <button class="btn" onclick="login()">Entrar</button>

    <p class="switch">
      ¿No tienes cuenta? <span onclick="showRegister()">Crear cuenta</span>
    </p>
  </div>

  <!-- REGISTRO -->
  <div class="form" id="registerForm">
    <h2>Crear cuenta</h2>
    <input id="regUser" class="input" placeholder="Usuario">
    <input id="regEmail" class="input" placeholder="Correo electrónico">
    <input type="password" id="regPassword" class="input" placeholder="Contraseña">
    <button class="btn" onclick="register()">Crear cuenta</button>

    <p class="switch">
      ¿Ya tienes cuenta? <span onclick="showLogin()">Iniciar sesión</span>
    </p>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, setDoc, doc } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyChOQg743fsmGK89KVLoNAri_VGklArRi4",
  authDomain: "web1-3b83a.firebaseapp.com",
  projectId: "web1-3b83a",
  storageBucket: "web1-3b83a.appspot.com",
  messagingSenderId: "519590670968",
  appId: "1:519590670968:web:cb291125919a12e9e7b38d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* LOGIN CON USUARIO O EMAIL */
window.login = async function(){
  const input = loginUser.value.trim();
  const pass = loginPassword.value;

  if(!input || !pass){
    alert("Completa todos los campos");
    return;
  }

  let email = input;

  if(!input.includes("@")){
    const q = query(collection(db,"users"), where("usuario","==",input));
    const snap = await getDocs(q);

    if(snap.empty){
      alert("No tienes cuenta. ¿Quieres crear una?");
      showRegister();
      return;
    }

    email = snap.docs[0].data().email;
  }

  signInWithEmailAndPassword(auth,email,pass)
    .then(()=> window.location.href="redes.html")
    .catch(()=>{
      alert("Contraseña incorrecta");
    });
}

/* REGISTRO */
window.register = async function(){
  const user = regUser.value.trim();
  const email = regEmail.value.trim();
  const pass = regPassword.value;

  if(!user || !email || !pass){
    alert("Completa todos los campos");
    return;
  }

  const q = query(collection(db,"users"), where("usuario","==",user));
  const snap = await getDocs(q);

  if(!snap.empty){
    alert("Ese usuario ya existe");
    return;
  }

  createUserWithEmailAndPassword(auth,email,pass)
    .then(cred=>{
      return setDoc(doc(db,"users",cred.user.uid),{
        usuario:user,
        email:email,
        rol:"user",
        premium:false
      });
    })
    .then(()=>{
      alert("Cuenta creada. Inicia sesión");
      showLogin();
    })
    .catch(err=>alert(err.message));
}

/* UI */
window.showLogin = function(){
  loginForm.classList.add("active");
  registerForm.classList.remove("active");
  tabLogin.classList.add("active");
  tabRegister.classList.remove("active");
}

window.showRegister = function(){
  registerForm.classList.add("active");
  loginForm.classList.remove("active");
  tabRegister.classList.add("active");
  tabLogin.classList.remove("active");
}
</script>

</body>
</html>
